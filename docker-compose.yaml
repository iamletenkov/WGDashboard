services:
  wgdashboard:
    # Upstream image + amneziawg-tools 3.x + AWG 3.x options in the panel
    # (see wgdashboard/Dockerfile and wgdashboard/patches/).
    build:
      context: ./wgdashboard
      args:
        WGD_VERSION: ${WGD_VERSION:-v4.3.3}
        AWG_TOOLS_REF: ${AWG_TOOLS_REF:-v3.1.20260812}
    image: wgdashboard-awg:${WGD_VERSION:-v4.3.3}-${AWG_TOOLS_REF:-v3.1.20260812}-awg3
    container_name: wgdashboard
    restart: always
    network_mode: host
    environment:
      - tz=${TZ}
      - wgd_port=${WGD_PORT}
      - username=${USERNAME}
      - password=${PASSWORD}
      - global_dns=${GLOBAL_DNS}
      # Endpoint written into peer configs; without it the entrypoint asks ifconfig.me,
      # which answers with whatever exit the host's traffic happens to take.
      - public_ip=${PUBLIC_IP}
      # Interfaces brought up on every container start, separated by ||, e.g. awg0||awg1.
      - wg_autostart=${WG_AUTOSTART}
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    entrypoint: ["/bin/bash", "/wrapper/entrypoint-wrapper.sh"]
    volumes:
      - aconf:/etc/amnezia/amneziawg
      - conf:/etc/wireguard
      - data:/data
      - ./wgdashboard/src/gunicorn.conf.py:/opt/wgdashboard/src/gunicorn.conf.py:ro
      - ./wgdashboard/entrypoint-wrapper.sh:/wrapper/entrypoint-wrapper.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=10 http://127.0.0.1:5000/ || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 60s


  # Mode is chosen by COMPOSE_PROFILES in .env (see README, section 2):
  #   domain — nginx + Let's Encrypt for DOMAIN;
  #   ip     — nginx with a self-signed certificate for the server address in DOMAIN;
  #   (none) — panel on 127.0.0.1 only, reach it through an SSH tunnel or VPN.
  certbot-init:
    image: alpine:3.21
    container_name: wg-certbot-init
    profiles: [domain, ip]
    restart: "no"
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
    environment:
      - DOMAIN=${DOMAIN}
      # domain: a one-day placeholder until certbot replaces it; ip: the certificate itself.
      - CERT_DAYS=${SELF_SIGNED_DAYS:-1}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        CERT_DIR="/etc/letsencrypt/live/$${DOMAIN}"
        if [ -f "$${CERT_DIR}/fullchain.pem" ]; then
          echo "[init] Certificate already exists, skipping"
          exit 0
        fi
        echo "[init] No certificate found, generating a self-signed one for $${CERT_DAYS} days..."
        apk add --no-cache openssl >/dev/null
        mkdir -p "$${CERT_DIR}"
        SAN="DNS:$${DOMAIN}"
        case "$${DOMAIN}" in *[!0-9.]*) ;; *) SAN="IP:$${DOMAIN}" ;; esac
        openssl req -x509 -nodes -days "$${CERT_DAYS}" \
          -newkey rsa:2048 \
          -keyout "$${CERT_DIR}/privkey.pem" \
          -out "$${CERT_DIR}/fullchain.pem" \
          -subj "/CN=$${DOMAIN}" -addext "subjectAltName=$${SAN}" 2>/dev/null
        echo "[init] Self-signed certificate created"

  nginx:
    image: nginx:1.27-alpine
    container_name: wg-nginx
    profiles: [domain, ip]
    restart: always
    network_mode: host
    depends_on:
      certbot-init:
        condition: service_completed_successfully
      wgdashboard:
        condition: service_started
    environment:
      - DOMAIN=${DOMAIN}
      - WGD_PORT=${WGD_PORT:-5000}
      # nginx directives for the panel, e.g. "allow 10.0.0.0/8; allow 192.168.0.0/16; deny all;"
      - PANEL_ACCESS=${PANEL_ACCESS:-allow all;}
    volumes:
      - ./nginx/conf.d:/etc/nginx/templates:ro
      - ./nginx/webroot:/var/www/certbot:ro
      - ./nginx/ssl:/etc/letsencrypt:ro
      # Reloads nginx when the certificate changes; no container needs the Docker socket.
      - ./nginx/reload-on-cert-change.sh:/docker-entrypoint.d/40-reload-on-cert-change.sh:ro

  certbot:
    image: certbot/certbot:latest
    container_name: wg-certbot
    profiles: [domain]
    restart: always
    stop_grace_period: 30s
    depends_on:
      nginx:
        condition: service_started
    environment:
      - DOMAIN=${DOMAIN}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
    volumes:
      - ./nginx/webroot:/var/www/certbot
      - ./nginx/ssl:/etc/letsencrypt
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # Initial issuance if no real cert exists; nginx picks it up on its next reload.
        if ! certbot certificates 2>/dev/null | grep -q "$${DOMAIN}"; then
          echo "[certbot] Cleaning up self-signed placeholder..."
          rm -rf /etc/letsencrypt/live/$${DOMAIN}
          rm -rf /etc/letsencrypt/archive/$${DOMAIN}
          rm -f  /etc/letsencrypt/renewal/$${DOMAIN}.conf
          echo "[certbot] Requesting certificate for $${DOMAIN}..."
          certbot certonly --webroot -w /var/www/certbot \
            -d "$${DOMAIN}" \
            --email "$${CERTBOT_EMAIL}" \
            --agree-tos --non-interactive
        fi
        while true; do
          echo "[certbot] $(date -u) running renew..."
          certbot renew --webroot -w /var/www/certbot --quiet || true
          sleep 12h
        done

volumes:
  aconf:
  conf:
  data:

